description: microTERRA is a Mexico-based food-ingredient company that develops functional
  ingredients derived from Lemna (duckweed). Its MAS product line delivers natural flavor
  enhancers and texture modifiers for the food and beverage industry, positioned as sustainable,
  clean-label alternatives that support salt and sugar reduction in formulations. A Techstars-backed
  B2B startup, microTERRA sells to food formulators and manufacturers and does not currently expose
  any public developer API, SDK, CLI, or technical documentation surface.
